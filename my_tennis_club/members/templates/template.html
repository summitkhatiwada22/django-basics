<!DOCTYPE html>
<html>
<body>

{% for x in tests %}
  <h1>{{ x }}</h1>
{% endfor %}

<p>In views.py we can see what the tests variable looks like.</p>

</body>
</html>

<!--

  We can also create variables directly in the template, by using the {% with %} template tag:
    {% with firstname="Tobias" %}
    <h1>Hello {{ firstname }}, how are you?</h1>

  To execute template tags, we surround them in {% %} brackets.
    {% if greeting == 1 %}
      <h1>Hello</h1>
    {% else %}
      <h1>Bye</h1>
    {% endif %}
  
  The template tags are a way of telling Django that here comes something else than plain HTML.
  The template tags allows us to to do some programming on the server before sending HTML to the client.
    <ul>
      {% for x in mymembers %}
        <li>{{ x.firstname }}</li>
      {% endfor %}
    </ul>

  MORE TAGS:
  https://www.w3schools.com/django/django_template_tags.php

  ALL PYTHON OPERATORS ARE SUPPORTED

  REVERSED
  The reversed keyword is used when you want to do the loop in reversed order.
    {% for x in members reversed %}
      <h1>{{ x.id }}</h1>
      <p>
        {{ x.firstname }}
        {{ x.lastname }}
      </p>
    {% endfor %}  

  EMPTY
  The empty keyword can be used if you want to do something special if the object is empty.
    <ul>
      {% for x in emptytestobject %}
        <li>{{ x.firstname }}</li>
      {% empty %}
        <li>No members</li>
      {% endfor %}
    </ul>  

  LOOP VARIABLES
    forloop.counter: The current iteration, starting at 1.
    forloop.counter0: The current iteration, starting at 0.
    forloop.first: Allows you to test if the loop is on its first iteration.
    forloop.last: Allows you to test if the loop is on its last iteration.
    forloop.revcounter: The current iteration if you start at the end and count backwards, ending up at 1.
    forloop.revcounter0: The current iteration if you start at the end and count backwards, ending up at 0.

  COMMENTS
    <h1>Welcome Everyone</h1>
    {% comment "Comment description here"%}
      <h1>Welcome ladies and gentlemen</h1>
    {% endcomment %}
    or use smaller comments
    <h1>Welcome{# Everyone#}</h1>

  INCLUDE
  The include tag allows us to include a template inside the current template.
  This is useful when we have a block of content that is the same for many pages.
  Example:
  templates/footer.html:
    <p>You have reached the bottom of this page, thank you for your time.</p>
  templates/template.html:
    <h1>Hello</h1>
    <p>This page contains a footer in a template.</p>
    {% include 'footer.html' %} 

  VARIABLES IN INCLUDE:
  templates/mymenu.html:
    <div>HOME | {{ me }} | ABOUT | FORUM | {{ sponsor }}</div>
  templates/template.html:
    <!DOCTYPE html>
    <html>
    <body>
    {% include "mymenu.html" with me="TOBIAS" sponsor="W3SCHOOLS" %}
    <h1>Welcome</h1>
    <p>This is my webpage</p>
    </body>
    </html> 
    
-->
